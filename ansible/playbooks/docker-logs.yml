---
# Read-only log tail for a single container on a managed host - remote
# equivalent of security-worker's docker.sock log access. Not live (see
# docs/security.md's TLS/socket-isolation note and the implementation plan
# this shipped under - live tail is deferred to the same Phase as Console,
# since both need a persistent channel this app doesn't have to a remote
# host today). container_name/tail_lines are validated server-side (same
# _DOCKER_NAME_RE as container-control.yml) before this ever runs.
- name: Fetch container log tail
  hosts: all
  gather_facts: false

  tasks:
    - name: "Fetch container log tail: {{ container_name }}"
      when: since is not defined or until is not defined
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - "--tail"
          - "{{ tail_lines }}"
          - "{{ container_name }}"
        expand_argument_vars: false
      register: result
      changed_when: false
      failed_when: false

    - name: Fetch timestamped logs in the selected monitoring window
      when: since is defined and until is defined
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - "--tail"
          - "{{ tail_lines }}"
          - "--timestamps"
          - "--since"
          - "{{ since }}"
          - "--until"
          - "{{ until }}"
          - "{{ container_name }}"
        expand_argument_vars: false
      register: window_result
      changed_when: false
      failed_when: false

    - name: Emit structured results
      vars:
        log_result: "{{ window_result if (since is defined and until is defined) else result }}"
      ansible.builtin.debug:
        msg: >-
          OPS_CENTER_QUERY_RESULT:{{ {'lines':
          ((log_result.stdout_lines | default([])) + (log_result.stderr_lines | default([]))),
          'ok': (log_result.rc == 0)} | to_json }}
