---
# Removes a docker-compose stack on a remote managed host (down --volumes,
# then deletes the stack directory) - remote equivalent of
# security-worker's remove_stack(). stack_name is validated server-side
# before this ever runs.
- name: Remove a docker-compose stack
  hosts: all
  gather_facts: false

  tasks:
    - name: Check whether this host has a dedicated /data volume
      ansible.builtin.stat:
        path: /data
      register: data_dir

    - name: Resolve the stacks root
      ansible.builtin.set_fact:
        stack_dir: >-
          {{ ('/data/ops-center-stacks' if (data_dir.stat.exists and data_dir.stat.isdir)
          else '/home/' ~ ansible_user ~ '/ops-center-stacks') ~ '/' ~ stack_name }}

    - name: Check the stack directory exists
      ansible.builtin.stat:
        path: "{{ stack_dir }}/compose.yml"
      register: compose_file

    - name: Docker compose down --volumes
      when: compose_file.stat.exists
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - "-p"
          - "{{ stack_name }}"
          - "-f"
          - "{{ stack_dir }}/compose.yml"
          - down
          - --volumes
      register: result
      changed_when: true

    - name: Remove the stack directory
      when: compose_file.stat.exists and (result.rc | default(1)) == 0
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: absent

    - name: Emit structured results
      vars:
        stderr_text: "{{ (result.stderr | default(''))[-8000:] if compose_file.stat.exists else 'stack not found' }}"
      ansible.builtin.debug:
        msg: >-
          OPS_CENTER_QUERY_RESULT:{{ {'ok': (compose_file.stat.exists and (result.rc | default(1)) == 0),
          'stdout': (result.stdout | default(''))[-8000:], 'stderr': stderr_text} | to_json }}
