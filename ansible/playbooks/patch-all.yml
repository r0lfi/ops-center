---
# Installs ALL pending updates (not just security). Supports rolling
# batches via `serial` (defaults to 1 = fully sequential).
- name: Install all pending updates
  hosts: all
  become: true
  gather_facts: true
  serial: "{{ batch_size | default(1) }}"

  tasks:
    - name: Record installed packages before patching
      ansible.builtin.package_facts:
        manager: auto
      failed_when: false

    - name: Remember packages before patching
      ansible.builtin.set_fact:
        ops_packages_before: "{{ ansible_facts.packages | default({}) }}"

    - name: RHEL family - install all updates
      when: ansible_os_family == "RedHat"
      # This playbook's entire purpose is installing everything available -
      # "latest" is intentional, not an idempotency oversight.
      ansible.builtin.dnf:  # noqa: package-latest
        name: "*"
        state: latest

    - name: Debian family - full dist-upgrade
      when: ansible_os_family == "Debian"
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    - name: Debian family - remove no-longer-needed packages
      when: ansible_os_family == "Debian"
      ansible.builtin.apt:
        autoremove: true

    # Reporting only: never changes the host and never fails the patch run.
    - name: Record installed packages after patching
      ansible.builtin.package_facts:
        manager: auto
      failed_when: false

    - name: Report package changes
      ansible.builtin.include_tasks: tasks/report-package-changes.yml
