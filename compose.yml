name: ops-center
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
networks:
  frontend: {}
  backend: {}
  database: {}
  monitoring: {}
services:
  proxy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTP_PORT:-8080}:8080
    networks:
    - frontend
    volumes:
    - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro,z
    - proxy-data:/data
    - proxy-config:/config
    depends_on:
      ops-frontend:
        condition: service_healthy
      ops-api:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    logging: *id001
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  ops-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-ops-center}/frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
    - frontend
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    - /var/lib/nginx/tmp:mode=1777
    - /run:mode=1777
    - /var/log/nginx:mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  ops-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-ops-center}/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
    - frontend
    - backend
    - monitoring
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      TALK_MEMORY_BINDINGS: ${TALK_MEMORY_BINDINGS:-[]}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      PROMETHEUS_SD_PATH: /app/prometheus-sd/node_exporters.json
      ANSIBLE_PLAYBOOKS_DIR: /app/ansible/playbooks
      GEOIP_DB_PATH: /app/geoip/dbip-city-lite.mmdb
      PATRONI_NODES: ${PATRONI_NODES:-}
      PATRONI_RESTAPI_USERNAME: patroni_admin
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:-}
      POSTGRES_VIP: ${POSTGRES_VIP:-}
      REDIS_NODES: ${REDIS_NODES:-redis}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
      TZ: ${TZ:-UTC}
      CAMERAS: ${CAMERAS:-[]}
      STREAMED_CAMERAS: ${STREAMED_CAMERAS:-[]}
      GO2RTC_URL: ${GO2RTC_URL:-}
      WG_EASY_URL: ${WG_EASY_URL:-}
      TRAFFIC_CADDY_HOST: ${TRAFFIC_CADDY_HOST:-}
      TRAFFIC_NPM_HOST: ${TRAFFIC_NPM_HOST:-}
      TRAFFIC_CADDY_LOG: ${TRAFFIC_CADDY_LOG:-/var/log/caddy/access.log}
      TRAFFIC_NPM_LOG_DIR: ${TRAFFIC_NPM_LOG_DIR:-/var/log/nginx-proxy-manager}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/secrets:/app/secrets:ro,z
    - ${DATA_ROOT:-/data/ops-center}/secrets/ai-providers:/app/secrets/ai-providers:z
    - ${DATA_ROOT:-/data/ops-center}/prometheus/file_sd:/app/prometheus-sd:z
    - ${DATA_ROOT:-/data/ops-center}/geoip:/app/geoip:ro,z
    - ./ansible/playbooks:/app/ansible/playbooks:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200
        else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    networks:
    - database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the installer to generate POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/postgres:/var/lib/postgresql/data:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7.4.2-bookworm
    restart: unless-stopped
    command: 'redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory
      256mb --maxmemory-policy allkeys-lru

      '
    mem_limit: 384m
    mem_reservation: 128m
    networks:
    - backend
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/redis:/data:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  ops-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: ${IMAGE_PREFIX:-ops-center}/worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    networks:
    - backend
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      LOKI_EXTERNAL_URL: ${LOKI_EXTERNAL_URL:-}
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
      CAMERA_WATCHDOG_TARGETS: ${CAMERA_WATCHDOG_TARGETS:-[]}
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_VERIFY_TLS: ${UNIFI_VERIFY_TLS:-true}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/secrets:/app/secrets:ro,z
    - ./ansible:/app/ansible:ro,z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - celery
      - -A
      - worker.celery_app:celery_app
      - inspect
      - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  ops-scheduler:
    image: ${IMAGE_PREFIX:-ops-center}/worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    command:
    - celery
    - -A
    - worker.celery_app:celery_app
    - beat
    - --loglevel=info
    - -S
    - redbeat.RedBeatScheduler
    networks:
    - backend
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
      CAMERA_WATCHDOG_TARGETS: ${CAMERA_WATCHDOG_TARGETS:-[]}
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_VERIFY_TLS: ${UNIFI_VERIFY_TLS:-true}
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  ops-ai-worker:
    build:
      context: .
      dockerfile: worker_ai/Dockerfile
    image: ${IMAGE_PREFIX:-ops-center}/ai-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    networks:
    - backend
    - database
    - monitoring
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      TALK_MEMORY_BINDINGS: ${TALK_MEMORY_BINDINGS:-[]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      TALK_BACKEND_URL: ${TALK_BACKEND_URL:-}
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/secrets:/app/secrets:ro,z
    - .:/repo:ro
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - celery
      - -A
      - worker_ai.celery_app:celery_app
      - inspect
      - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    networks:
    - monitoring
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro,z
    - ${DATA_ROOT:-/data/ops-center}/prometheus/file_sd:/etc/prometheus/file_sd:ro,z
    - ${DATA_ROOT:-/data/ops-center}/prometheus/data:/prometheus:z
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.enable-lifecycle
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9090/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    networks:
    - monitoring
    volumes:
    - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
    - ${DATA_ROOT:-/data/ops-center}/alertmanager:/alertmanager:z
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9093/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    networks:
    - monitoring
    - frontend
    volumes:
    - ./monitoring/blackbox/blackbox.yml:/config/blackbox.yml:ro,z
    command:
    - --config.file=/config/blackbox.yml
    cap_add:
    - NET_RAW
    security_opt:
    - no-new-privileges:true
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9115/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    networks:
    - monitoring
    - frontend
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run the installer to generate
        GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
    - ${DATA_ROOT:-/data/ops-center}/grafana:/var/lib/grafana:z
    depends_on:
      prometheus:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  trivy-server:
    image: aquasec/trivy:0.72.0
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    command:
    - server
    - --listen
    - 0.0.0.0:4954
    networks:
    - backend
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/trivy:/root/.cache/trivy:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:4954/healthz
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  security-worker:
    build:
      context: .
      dockerfile: security/Dockerfile
    image: ${IMAGE_PREFIX:-ops-center}/security-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    command: 'celery -A security.celery_app:celery_app worker --loglevel=info --concurrency=1
      -Q security,security.${OPS_LOCAL_HOSTNAME:-ops-host}

      '
    networks:
    - backend
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      TRIVY_SERVER: http://trivy-server:4954
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_STACKS_ROOT: /data/docker-stacks
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${DATA_ROOT:-/data/ops-center}/docker-stacks:/data/docker-stacks:z
    group_add:
    - ${DOCKER_GID:?Set DOCKER_GID to the Docker socket group}
    depends_on:
      trivy-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - celery
      - -A
      - security.celery_app:celery_app
      - inspect
      - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    networks:
    - monitoring
    volumes:
    - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro,z
    - ${DATA_ROOT:-/data/ops-center}/loki:/loki:z
    command:
    - -config.file=/etc/loki/local-config.yaml
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3100/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    networks:
    - monitoring
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    devices:
    - /dev/kmsg
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *id001
    profiles:
    - host-metrics
volumes:
  proxy-data: null
  proxy-config: null
