name: ops-center
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
networks:
  frontend: {}
  backend: {}
  database: {}
  monitoring: {}
services:
  proxy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTP_PORT:-8080}:8080
    networks:
    - frontend
    volumes:
    - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro,z
    - proxy-data:/data
    - proxy-config:/config
    depends_on:
      ops-frontend:
        condition: service_healthy
      ops-api:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    logging: *id001
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  ops-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/r0lfi/ops-center}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
    - frontend
    read_only: true
    tmpfs:
    - /tmp:mode=1777
    - /var/lib/nginx/tmp:mode=1777
    - /run:mode=1777
    - /var/log/nginx:mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  ops-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/r0lfi/ops-center}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
    - frontend
    - backend
    - monitoring
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      TALK_MEMORY_BINDINGS: ${TALK_MEMORY_BINDINGS:-[]}
      TALK_AGENT_ROUTES: ${TALK_AGENT_ROUTES:-[]}
      AI_TRAFFIC_INGEST_TOKEN: ${AI_TRAFFIC_INGEST_TOKEN:-}
      NOVA_DATA_SOURCES: ${NOVA_DATA_SOURCES:-[]}
      TALK_BACKEND_URL: ${TALK_BACKEND_URL:-}
      TALK_NOTIFICATIONS_ENABLED: ${TALK_NOTIFICATIONS_ENABLED:-false}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      SESSION_REMEMBER_IDLE_DAYS: ${SESSION_REMEMBER_IDLE_DAYS:-30}
      SESSION_REMEMBER_ABSOLUTE_DAYS: ${SESSION_REMEMBER_ABSOLUTE_DAYS:-90}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-72}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      REAUTH_MAX_AGE_SECONDS: ${REAUTH_MAX_AGE_SECONDS:-300}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      PROMETHEUS_SD_PATH: /app/prometheus-sd/node_exporters.json
      ANSIBLE_PLAYBOOKS_DIR: /app/ansible/playbooks
      GEOIP_DB_PATH: /app/geoip/dbip-city-lite.mmdb
      LOKI_URL: ${LOKI_HEALTH_URL:-http://loki:3100/ready}
      PATRONI_NODES: ${PATRONI_NODES:-}
      PATRONI_REST_PORT: ${PATRONI_REST_PORT:-8008}
      PATRONI_RESTAPI_USERNAME: ${PATRONI_RESTAPI_USERNAME:-patroni_admin}
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:-}
      POSTGRES_VIP: ${POSTGRES_VIP:-}
      REDIS_NODES: ${REDIS_NODES:-redis}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
      TZ: ${TZ:-UTC}
      CAMERAS: ${CAMERAS:-[]}
      STREAMED_CAMERAS: ${STREAMED_CAMERAS:-[]}
      GO2RTC_URL: ${GO2RTC_URL:-}
      WIREGUARD_URL: ${WIREGUARD_URL:-}
      WIREGUARD_PASSWORD_PATH: ${WIREGUARD_PASSWORD_PATH:-integrations/wireguard-admin-password}
      MONITORING_CONTAINER_TARGETS: ${MONITORING_CONTAINER_TARGETS:-}
      PROMETHEUS_QUERY_URL: ${PROMETHEUS_QUERY_URL:-http://prometheus:9090}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/secrets:/app/secrets:ro,z
    - ${DATA_ROOT:-/data/ops-center}/secrets/ai-providers:/app/secrets/ai-providers:z
    - ${DATA_ROOT:-/data/ops-center}/prometheus/file_sd:/app/prometheus-sd:z
    - ${DATA_ROOT:-/data/ops-center}/geoip:/app/geoip:ro,z
    - ./ansible/playbooks:/app/ansible/playbooks:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200
        else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    networks:
    - database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the installer to generate POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/postgres:/var/lib/postgresql/data:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7.4.2-bookworm
    restart: unless-stopped
    command: 'redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory
      256mb --maxmemory-policy allkeys-lru

      '
    mem_limit: 384m
    mem_reservation: 128m
    networks:
    - backend
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/redis:/data:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  ops-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/r0lfi/ops-center}/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    networks:
    - backend
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      LOKI_EXTERNAL_URL: ${LOKI_EXTERNAL_URL:-}
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
      CAMERA_WATCHDOG_TARGETS: ${CAMERA_WATCHDOG_TARGETS:-[]}
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_VERIFY_TLS: ${UNIFI_VERIFY_TLS:-true}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/secrets:/app/secrets:ro,z
    - ./ansible:/app/ansible:ro,z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - celery
      - -A
      - worker.celery_app:celery_app
      - inspect
      - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  ops-scheduler:
    image: ${IMAGE_PREFIX:-ghcr.io/r0lfi/ops-center}/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    # --max-interval 10: redbeat derives its lock TTL from this (5x = 50s) and
    # the standby beat on the other host polls for the lock at this interval.
    # With the 300s default the lock lived 25 min, so a beat that died on a
    # Redis failover blocked all scheduled tasks for up to 25 min.
    command: ["celery", "-A", "worker.celery_app:celery_app", "beat", "--loglevel=info", "-S", "redbeat.RedBeatScheduler", "--max-interval", "10"]
    networks:
    - backend
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
      CAMERA_WATCHDOG_TARGETS: ${CAMERA_WATCHDOG_TARGETS:-[]}
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_VERIFY_TLS: ${UNIFI_VERIFY_TLS:-true}
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  ops-ai-worker:
    build:
      context: .
      dockerfile: worker_ai/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/r0lfi/ops-center}/ai-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      ops-center.ai-traffic: "1"
    init: true
    networks:
    - backend
    - database
    - monitoring
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      TALK_MEMORY_BINDINGS: ${TALK_MEMORY_BINDINGS:-[]}
      NOVA_DATA_SOURCES: ${NOVA_DATA_SOURCES:-[]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      SECRETS_ROOT: /app/secrets
      TALK_BACKEND_URL: ${TALK_BACKEND_URL:-}
      LOKI_URL: ${LOKI_API_URL:-http://loki:3100}
      PROMETHEUS_URL: ${PROMETHEUS_API_URL:-http://prometheus:9090}
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/secrets:/app/secrets:ro,z
    - .:/repo:ro
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - celery
      - -A
      - worker_ai.celery_app:celery_app
      - inspect
      - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # AI Traffic Monitor - passive collector (ai_traffic_collector/, Rust).
  # Read-only: subscribes to this host's conntrack NEW/DESTROY events and
  # captures packet headers (SYN/RST, DNS, TLS ClientHello, ICMP errors)
  # of the AI containers on their bridges. It adds no firewall rule, route,
  # proxy or policy and never decrypts. Host network/PID namespaces are
  # needed to see the bridges, conntrack and /proc; docker.sock only for
  # GET of container addresses. Posts to ops-api through the local proxy
  # with its per-node AI_TRAFFIC_COLLECTOR_TOKEN; without one it idles.
  # ---------------------------------------------------------------------
  ai-traffic-collector:
    build:
      context: ./ai_traffic_collector
    image: ${IMAGE_PREFIX:-ghcr.io/r0lfi/ops-center}/ai-traffic-collector:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    network_mode: host
    pid: host
    read_only: true
    tmpfs:
    - /tmp:size=64m
    environment:
      AI_TRAFFIC_NODE: ${OPS_LOCAL_HOSTNAME:-ops-host}
      # Only this node's derived token, never the API's secret (see .env.example).
      AI_TRAFFIC_INGEST_TOKEN: ${AI_TRAFFIC_COLLECTOR_TOKEN:-}
      AI_TRAFFIC_API: http://127.0.0.1:${PROXY_HTTP_PORT:-8080}
      # Containers labelled ops-center.ai-traffic=1 are observed; names are optional.
      AI_TRAFFIC_CONTAINERS: ${AI_TRAFFIC_CONTAINERS:-}
      AI_TRAFFIC_CAPTURE: ${AI_TRAFFIC_CAPTURE:-1}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN        # subscribe to conntrack netlink events (no writes)
    - NET_RAW          # header-only packet capture
    - SYS_PTRACE       # read /proc/<pid>/fd of the AI worker's processes
    - DAC_READ_SEARCH
    security_opt:
    - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging: *id001
    # Optional: start with `docker compose --profile ai-traffic up -d`.
    profiles:
    - ai-traffic

  # ---------------------------------------------------------------------
  # Prometheus - metrics storage + scraping. Internal only (not published
  # to the host, not routed through the proxy - "internal API").
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    networks:
    - monitoring
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro,z
    - ${DATA_ROOT:-/data/ops-center}/prometheus/file_sd:/etc/prometheus/file_sd:ro,z
    - ${DATA_ROOT:-/data/ops-center}/prometheus/data:/prometheus:z
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.enable-lifecycle
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9090/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    networks:
    - monitoring
    volumes:
    - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
    - ${DATA_ROOT:-/data/ops-center}/alertmanager:/alertmanager:z
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9093/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    networks:
    - monitoring
    - frontend
    volumes:
    - ./monitoring/blackbox/blackbox.yml:/config/blackbox.yml:ro,z
    command:
    - --config.file=/config/blackbox.yml
    cap_add:
    - NET_RAW
    security_opt:
    - no-new-privileges:true
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9115/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    networks:
    - monitoring
    - frontend
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run the installer to generate
        GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
    - ${DATA_ROOT:-/data/ops-center}/grafana:/var/lib/grafana:z
    depends_on:
      prometheus:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  trivy-server:
    image: aquasec/trivy:0.72.0
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    command:
    - server
    - --listen
    - 0.0.0.0:4954
    networks:
    - backend
    volumes:
    - ${DATA_ROOT:-/data/ops-center}/trivy:/root/.cache/trivy:z
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:4954/healthz
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  security-worker:
    build:
      context: .
      dockerfile: security/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/r0lfi/ops-center}/security-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    command: 'celery -A security.celery_app:celery_app worker --loglevel=info --concurrency=1
      -Q security,security.${OPS_LOCAL_HOSTNAME:-ops-host}

      '
    networks:
    - backend
    - database
    environment:
      OPS_CENTER_ENV: ${OPS_CENTER_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:?Run the installer to generate API_SECRET_KEY}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Run
        the installer to generate POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the installer to generate REDIS_PASSWORD}
      REDIS_SENTINELS: ${REDIS_SENTINELS:-}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-ops-center-redis}
      TRIVY_SERVER: http://trivy-server:4954
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_STACKS_ROOT: /data/docker-stacks
      TZ: ${TZ:-UTC}
      OPS_LOCAL_HOSTNAME: ${OPS_LOCAL_HOSTNAME:-ops-host}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${DATA_ROOT:-/data/ops-center}/docker-stacks:/data/docker-stacks:z
    group_add:
    - ${DOCKER_GID:?Set DOCKER_GID to the Docker socket group}
    depends_on:
      trivy-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD
      - celery
      - -A
      - security.celery_app:celery_app
      - inspect
      - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    networks:
    - monitoring
    volumes:
    - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro,z
    - ${DATA_ROOT:-/data/ops-center}/loki:/loki:z
    command:
    - -config.file=/etc/loki/local-config.yaml
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3100/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    networks:
    - monitoring
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    devices:
    - /dev/kmsg
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *id001
    profiles:
    - host-metrics
volumes:
  proxy-data: null
  proxy-config: null
