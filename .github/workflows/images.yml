name: Build or publish images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: '0.1.0'
      publish:
        description: Push images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: postgres-ha, context: ha/postgres, file: ha/postgres/Dockerfile}
          - {image: api, context: backend, file: backend/Dockerfile}
          - {image: frontend, context: frontend, file: frontend/Dockerfile}
          - {image: worker, context: '.', file: worker/Dockerfile}
          - {image: ai-worker, context: '.', file: worker_ai/Dockerfile}
          - {image: security-worker, context: '.', file: security/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release.py
      - name: Derive lowercase registry namespace
        id: namespace
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.namespace.outputs.prefix }}/${{ matrix.image }}:${{ inputs.tag }}
          provenance: true
          sbom: true
