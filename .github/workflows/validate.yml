name: Validate source
on:
  # Branches only: a pushed v* tag is validated by release.yml, which calls
  # this workflow before it publishes anything.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-release.py
      - name: Scan full Git history for secrets
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' gitleaks_8.24.3_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - run: pip install pytest ansible-core==2.18.19
      - run: pytest tests/ -q
      - name: Validate installer syntax
        run: ansible-playbook --syntax-check -i deploy/inventory.example.ini deploy/install.yml -e ops_admin_username=test -e ops_admin_password=validation-only-password -e ops_release_archive=/tmp/unused.tar.gz
      - name: Validate HA installer syntax
        run: ansible-playbook --syntax-check -i deploy/inventory.example.ini deploy/ha.yml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, worker, worker_ai, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ${{ matrix.component }}/requirements.txt pytest pytest-asyncio
      - run: pip install ansible-core==2.18.19
        if: matrix.component == 'backend'
      - run: PYTHONPATH="$PWD:$PWD/backend" python -m pytest ${{ matrix.component }}/tests -q

  traffic-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: traffic_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: PYTHONPATH=backend:. python backend/tests/verify_traffic_postgres.py
        env:
          TEST_TRAFFIC_DATABASE_URL: postgresql+asyncpg://postgres:synthetic-ci-only@127.0.0.1:5432/traffic_test
      - name: Verify clean-install migrations
        run: cd backend && alembic upgrade head
        env:
          API_SECRET_KEY: synthetic-ci-only
          DATABASE_URL: postgresql+asyncpg://postgres:synthetic-ci-only@127.0.0.1:5432/traffic_test
          DATABASE_URL_SYNC: postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/traffic_test
          REDIS_URL: redis://127.0.0.1:1/0
      - name: Prepare dedicated collaboration database
        run: |
          python - <<'PYCODE'
          import psycopg
          with psycopg.connect("postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/traffic_test", autocommit=True) as db:
              db.execute("CREATE DATABASE ops_collaboration_test")
          PYCODE
      - run: PYTHONPATH=backend:. python -m pytest worker_ai/tests/test_collaboration.py -q
        env:
          COLLAB_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/ops_collaboration_test

  mcp-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: ops_mcp_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_SECRET_KEY: synthetic-ci-only-not-for-production-mcp-test-key
      MCP_PUBLIC_URL: https://ops.example.com/mcp
      DATABASE_URL: postgresql+asyncpg://postgres:synthetic-ci-only@127.0.0.1:5432/ops_mcp_test
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/ops_mcp_test
      REDIS_URL: redis://127.0.0.1:1/0
      OPS_MCP_TEST_DATABASE: ops_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Verify clean-install migration
        run: cd backend && alembic upgrade head
      - name: Verify standard MCP and access boundaries
        run: PYTHONPATH=backend:. python -m pytest backend/tests/test_mcp_integration.py backend/tests/test_mcp_catalog.py -q
      - name: Verify MCP rollback and upgrade
        run: cd backend && alembic downgrade 0041 && alembic upgrade head

  images:
    # Every application image must build on every change, not only at release
    # time. Nothing is pushed here; the layer cache is shared with release.yml.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: api, context: backend, file: backend/Dockerfile}
          - {image: frontend, context: frontend, file: frontend/Dockerfile}
          - {image: worker, context: '.', file: worker/Dockerfile}
          - {image: ai-worker, context: '.', file: worker_ai/Dockerfile}
          - {image: security-worker, context: '.', file: security/Dockerfile}
          - {image: postgres-ha, context: ha/postgres, file: ha/postgres/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  stack:
    # The whole standard stack from images built from this commit: health
    # checks, web interface, login and persistence across a restart. A release
    # runs the same test against the exact images it publishes instead.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: ops-center/api:ci
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: ops-center/frontend:ci
          cache-from: type=gha,scope=frontend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          load: true
          tags: ops-center/worker:ci
          cache-from: type=gha,scope=worker
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker_ai/Dockerfile
          load: true
          tags: ops-center/ai-worker:ci
          cache-from: type=gha,scope=ai-worker
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: security/Dockerfile
          load: true
          tags: ops-center/security-worker:ci
          cache-from: type=gha,scope=security-worker
      - name: Smoke test
        env:
          IMAGE_PREFIX: ops-center
          IMAGE_TAG: ci
          SMOKE_VERSION: 0.0.0-dev
        run: bash scripts/test/smoke-stack.sh
